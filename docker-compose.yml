# Eco-Scale — run the WHOLE app with one command (no Python/Node needed):
#
#     docker compose up --build
#
#   Console + API : http://localhost:8000        (the React control plane)
#   API docs      : http://localhost:8000/docs
#   Dashboard     : http://localhost:8501        (Streamlit research view)
#
# Simulation works fully in the container. The Live-cluster and Real A/B tabs
# need kubectl + a real cluster (which a container doesn't have) — for those,
# run `uvicorn serving.api:app` directly on a host that has kubectl access.
services:
  app:
    build: .
    image: eco-scale
    container_name: eco-scale-console
    ports:
      - "8000:8000"
    command: uvicorn serving.api:app --host 0.0.0.0 --port 8000
    restart: unless-stopped

  streamlit:
    image: eco-scale            # reuses the image built by `app`
    container_name: streamlit-dashboard
    ports:
      - "8501:8501"
    command: streamlit run serving/dashboard.py --server.port 8501 --server.address 0.0.0.0
    depends_on:
      - app
    restart: unless-stopped
